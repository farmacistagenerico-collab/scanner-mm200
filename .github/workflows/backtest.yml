name: Backtest IT

on:
  pull_request:
    paths:
      - "momentum*.py"
      - "selezione_oggi.py"
      - "titoli_italiani.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/backtest.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      - name: Test di regressione
        run: python -m unittest discover -s tests -v
      - name: Bootstrap dati Italia
        run: python bootstrap_dati.py --mercato IT --forza
      - name: Backtest Italia 2010-oggi
        run: python momentum_risk.py --mercato IT --dal 2010-01-01
      - name: Selezione operativa Italia
        run: python selezione_oggi.py --mercato IT --no-download
      - name: Pubblica riepilogo verificabile
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path('output/momentum_risk_riepilogo.json').read_text())
          righe = []
          righe.append('## Backtest Italia ricalcolato')
          righe.append(f"Periodo: {d['periodo']['da']} → {d['periodo']['a']} · titoli: {d['universo']['titoli']}")
          righe.append(f"Benchmark principale: `{d['benchmark_principale']}`")
          righe.append(f"Validato: **{d['validato']}** · {d['nota_validazione']}")
          righe.append('')
          righe.append('| Variante | CAGR % | Sharpe | Max DD % | Turnover %/mese |')
          righe.append('|---|---:|---:|---:|---:|')
          for v in d['varianti']:
              nome = v['variante']
              if not (nome.startswith(('①','②','③','⓪','◇'))):
                  continue
              righe.append(f"| {nome} | {v.get('CAGR_%','')} | {v.get('Sharpe','')} | {v.get('max_drawdown_%','')} | {v.get('turnover_mensile_%','')} |")
          gaps = d.get('gaps_dati', {})
          n_gaps = sum(len(x) for x in gaps.values())
          righe.append('')
          righe.append(f'Gap dati segnalati: {n_gaps}. Costi: {d["esecuzione"]["costo_lato"]*100:.2f}% per lato.')
          Path('backtest-comment.md').write_text('\n'.join(righe))
          PY
          cat backtest-comment.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file backtest-comment.md
      - name: Carica risultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-it
          path: |
            output/momentum_risk_riepilogo.json
            output/momentum_risk_varianti.csv
            output/momentum_risk_equity.csv
            output/momentum_risk_per_anno.csv
            output/momentum_risk_is_oos.csv
            output/momentum_risk_crash.csv
            output/report_momentum_risk.html
            output/selezione_oggi.md
            output/portafoglio_attuale.csv
          if-no-files-found: warn
